<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Packages | Infinity Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .font-orbit { font-family: 'Orbitron', sans-serif; }
        .glass-luxury { background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.95)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .border-animate { position: relative; background: linear-gradient(#0f172a, #0f172a) padding-box, linear-gradient(90deg, #7c3aed, #0ea5e9, #f59e0b, #7c3aed) border-box; border: 2px solid transparent; background-size: 300% 300%; animation: gradient-flow 6s ease infinite; }
        @keyframes gradient-flow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        <a href="index1.html" class="text-indigo-400 flex items-center gap-2 font-bold uppercase text-xs hover:text-white transition">← Back to Dashboard</a>

        <h2 class="font-orbit text-2xl font-bold text-yellow-500 uppercase">My Active Packages</h2>

        <div id="deposits-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 text-gray-500">Syncing Packages...</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="components.js"></script>
    <script src="web3-handler.js"></script>
    <script>
        lucide.createIcons();

        async function loadActiveDeposits() {
    const grid = document.getElementById('deposits-grid');
    const address = localStorage.getItem('userAddress');

    if (!window.contract || !address) {
        setTimeout(loadActiveDeposits, 1000);
        return;
    }

    try {
        // आपके कॉन्ट्रैक्ट में मौजूद फंक्शन का इस्तेमाल
        const data = await window.contract.globalOrbitPurchaseDetails(address);
        
        // data[0] = bool[10] (purchasedPackage)
        // data[1] = uint256[10] (purchasedTimestamp)
        const packages = data[0]; 
        const timestamps = data[1];
        
        const pkgPrices = [11, 22, 44, 88, 176, 352, 704, 1408, 2816, 5632];
        
        let html = '';
        let foundAny = false;

        for (let i = 0; i < 10; i++) {
            // अगर पैकेज खरीदा हुआ है (true)
            if (packages[i] === true) {
                foundAny = true;
                html += `
                <div class="glass-luxury border-animate p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-orbit text-xl font-bold text-yellow-500">$${pkgPrices[i]}</h3>
                        <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded">ACTIVE</span>
                    </div>
                    <p class="text-[10px] text-gray-400 uppercase">Activated On</p>
                    <p class="text-xs font-bold">${new Date(timestamps[i] * 1000).toLocaleDateString()}</p>
                </div>`;
            }
        }

        grid.innerHTML = foundAny ? html : `<div class="col-span-full text-center py-20 text-gray-600">No active packages found.</div>`;
        
        lucide.createIcons();
    } catch (err) {
        console.error("Error in loadActiveDeposits:", err);
        grid.innerHTML = `<div class="col-span-full text-center py-20 text-red-500">Error loading data.</div>`;
    }
}

        window.addEventListener('load', () => setTimeout(loadActiveDeposits, 1500));
    </script>
</body>
</html>
